# ================================================================================================
# Docker Compose Configuration for Production (디스크 용량 최적화)
# ================================================================================================
# 프로덕션 환경을 위한 최적화된 설정
# - data 디렉토리를 named volume으로 관리 (이미지에 포함하지 않음)
# - chromadb도 named volume 사용
# - 개발용 볼륨 마운트 제거
# ================================================================================================

services:
  # ==============================================================================================
  # PostgreSQL Database
  # ==============================================================================================
  postgres:
    image: postgres:15-alpine
    container_name: elderly_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elderly_rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-elderly_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elderly_rag_password_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - elderly_rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elderly_rag_user} -d ${POSTGRES_DB:-elderly_rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================================
  # Django Backend Application (Production Optimized)
  # ==============================================================================================
  django:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements-prod.txt
    container_name: elderly_rag_django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Django Settings
      DJANGO_SETTINGS_MODULE: config.django_settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-4senior.o-r.kr,43.202.39.220}

      # Database Settings
      POSTGRES_DB: ${POSTGRES_DB:-elderly_rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-elderly_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # OpenAI Settings
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # ChromaDB Settings
      CHROMA_HOST: ${CHROMA_HOST:-localhost}
      CHROMA_PORT: ${CHROMA_PORT:-8000}

      # RAG Settings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DATA_DIRECTORY: /app/data
      CHROMA_PERSIST_DIR: /app/chromadb_storage
      RAG_CACHE_DIR: /app/cache

      # Disable Chroma telemetry
      CHROMA_TELEMETRY: "false"
      CHROMA_TELEMETRY_ENABLED: "false"
      CHROMA_ANONYMIZED_TELEMETRY: "false"

      # Application Settings
      LOAD_DOCUMENTS: ${LOAD_DOCUMENTS:-true}
    volumes:
      # Production: 코드는 이미지에 포함, 데이터만 볼륨으로 관리
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - chromadb_volume:/app/chromadb_storage
      - data_volume:/app/data  # data를 named volume으로 관리
      - logs_volume:/app/logs
    ports:
      - "8080:8080"
    networks:
      - elderly_rag_network
    # 리소스 제한 (필요시 조정)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ==============================================================================================
  # Nginx Web Server & Reverse Proxy
  # ==============================================================================================
  nginx:
    image: nginx:alpine
    container_name: elderly_rag_nginx
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "8000:80"
    networks:
      - elderly_rag_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================================================================================================
# Named Volumes (프로덕션 환경에서 영구 데이터 저장)
# ================================================================================================
volumes:
  postgres_data:
    name: elderly_rag_postgres_data
  static_volume:
    name: elderly_rag_static
  media_volume:
    name: elderly_rag_media
  chromadb_volume:
    name: elderly_rag_chromadb
  data_volume:
    name: elderly_rag_data  # PDF 문서 등 대용량 데이터
  logs_volume:
    name: elderly_rag_logs

# ================================================================================================
# Networks
# ================================================================================================
networks:
  elderly_rag_network:
    name: elderly_rag_network
    driver: bridge
